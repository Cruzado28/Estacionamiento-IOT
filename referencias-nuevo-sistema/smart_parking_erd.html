<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only">Diagrama entidad-relación del sistema Smart Parking IoT, mostrando roles, vehículos, conductores, sesiones de estacionamiento, espacios, establecimientos, actividades, promociones, tarifas, dispositivos IoT y eventos del sistema.</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const def = `erDiagram
  ROLES ||--o{ VEHICULOS : asigna
  CONDUCTORES ||--o{ VEHICULOS : posee
  VEHICULOS ||--o{ SESIONES_PARQUEO : genera
  ESPACIOS ||--o{ SESIONES_PARQUEO : ocupa
  SESIONES_PARQUEO ||--o{ ACTIVIDADES : incluye
  ESTABLECIMIENTOS ||--o{ ACTIVIDADES : registra
  SESIONES_PARQUEO ||--o{ PROMOCION_APLICADA : aplica
  PROMOCIONES ||--o{ PROMOCION_APLICADA : usada_en
  DISPOSITIVOS_IOT ||--o{ LOGS_IOT : genera
  DISPOSITIVOS_IOT ||--o{ EVENTOS_SISTEMA : origina
  SESIONES_PARQUEO ||--o{ EVENTOS_SISTEMA : relaciona
  ADMINISTRADORES ||--o{ EVENTOS_SISTEMA : revisa

  ROLES {
    int id PK
    string nombre
    string icono
    decimal porcentaje_descuento
    int horas_gratis
    boolean exoneracion_total
    string prioridad_acceso
    string descripcion
  }
  CONDUCTORES {
    int id PK
    string nombre_completo
    string documento
    string telefono
    string correo
  }
  VEHICULOS {
    int id PK
    string placa UK
    int conductor_id FK
    int rol_id FK
    string tipo
    string marca
    string modelo
    string color
    string estado
  }
  ESPACIOS {
    int id PK
    int numero UK
    string estado
    string motivo_mantenimiento
  }
  SESIONES_PARQUEO {
    int id PK
    int vehiculo_id FK
    int espacio_id FK
    datetime fecha_hora_ingreso
    datetime fecha_hora_salida
    decimal tarifa_aplicada
    decimal monto_consumo
    decimal monto_descuento
    decimal monto_total_pagado
    string estado
  }
  ESTABLECIMIENTOS {
    int id PK
    string nombre
    string categoria
    string icono
    string ubicacion
    string tipo_registro
    string estado
    string descripcion
  }
  ACTIVIDADES {
    int id PK
    int sesion_id FK
    int establecimiento_id FK
    datetime fecha_hora
    string descripcion
    decimal monto_consumo
    int duracion_minutos
  }
  PROMOCIONES {
    int id PK
    string nombre
    decimal monto_minimo
    string beneficio
    date fecha_inicio
    date fecha_fin
    string estado
  }
  PROMOCION_APLICADA {
    int id PK
    int sesion_id FK
    int promocion_id FK
    datetime fecha_aplicacion
  }
  TARIFAS_CONFIG {
    int id PK
    decimal tarifa_hora
    decimal tarifa_minuto
    int tiempo_gracia_min
    decimal tarifa_maxima_diaria
    time horario_promo_inicio
    time horario_promo_fin
    datetime actualizado_en
  }
  DISPOSITIVOS_IOT {
    int id PK
    string nombre
    string tipo_conexion
    string direccion_red
    string estado
    int intensidad_senal
    datetime ultima_conexion
  }
  LOGS_IOT {
    int id PK
    int dispositivo_id FK
    datetime fecha_hora
    string nivel
    string mensaje
  }
  EVENTOS_SISTEMA {
    int id PK
    string tipo_evento
    int sesion_id FK
    int dispositivo_id FK
    string descripcion
    datetime fecha_hora
  }
  ADMINISTRADORES {
    int id PK
    string nombre
    string correo UK
    string contrasena_hash
    string tema_preferido
    string color_principal
  }`;
const { svg } = await mermaid.render('erd-svg', def);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
